    <script>
      (async function () {
        try {
          const res = await fetch('https://huggingface.co/datasets/Ijwi-ry-Ikirundi-AI/Kirundi_Open_Speech_Dataset/raw/main/metadata.csv');
          if (!res.ok) return;
          const text = await res.text();
          const rows = text.split('\n').filter(function (l) { return l.trim().length > 0; }).length - 1;
          document.querySelectorAll('.live-sentences').forEach(function (el) {
            el.textContent = rows.toLocaleString();
          });
        } catch (_) {}
      })();
    </script>
