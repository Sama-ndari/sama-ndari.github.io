    <script>
      (async function () {
        try {
          var results = await Promise.allSettled([
            fetch('https://huggingface.co/api/datasets/Ijwi-ry-Ikirundi-AI/Kirundi_Open_Speech_Dataset'),
            fetch('https://huggingface.co/datasets/Ijwi-ry-Ikirundi-AI/Kirundi_Open_Speech_Dataset/raw/main/metadata.csv')
          ]);
          if (results[0].status === 'fulfilled') {
            var hfData = await results[0].value.json();
            var dlEl = document.getElementById('cs-downloads');
            if (dlEl && hfData.downloads > 0) dlEl.textContent = hfData.downloads.toLocaleString();
          }
          if (results[1].status === 'fulfilled') {
            var text = await results[1].value.text();
            var rows = text.split('\n').filter(function (l) { return l.trim().length > 0; }).length - 1;
            document.querySelectorAll('.live-sentences').forEach(function (el) {
              el.textContent = Math.max(0, rows).toLocaleString();
            });
          }
        } catch (_) {}
      })();
    </script>
