    <script>
      (async function () {
        try {
          var res = await fetch('https://huggingface.co/datasets/Ijwi-ry-Ikirundi-AI/Kirundi_Open_Speech_Dataset/raw/main/metadata.csv');
          if (!res.ok) return;
          var text = await res.text();
          var rows = text.split('\n').filter(function (l) { return l.trim().length > 0; }).length - 1;
          document.querySelectorAll('.live-sentences').forEach(function (el) {
            el.textContent = Math.max(0, rows).toLocaleString();
          });
        } catch (_) {}
      })();
    </script>
  
  <script defer src="../../../assets/js/chat-widget.js"></script>
