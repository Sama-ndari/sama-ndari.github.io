  <div class="gh-app">
    <main id="main" class="me-chat">
      <header class="me-chat__pagehead">
        <div class="me-chat__pagehead-row">
          <h1 class="me-chat__page-title">
            <span data-i18n="clone_page_title">Talk to my clone</span>
          </h1>
          <button type="button" id="me-chat-clear" class="me-chat__clear" data-i18n-aria-label="clone_clear_aria" data-i18n-title="clone_clear_aria" title="Clear conversation">
            <i class="bi bi-trash3" aria-hidden="true"></i>
            <span class="me-chat__clear-label" data-i18n="clone_clear_label">Clear</span>
          </button>
        </div>
        <p class="me-chat__page-meta">
          <img class="me-chat__meta-avatar" src="assets/img/icon.png" alt="" width="20" height="20" decoding="async">
          <strong data-i18n="clone_header_name">Samandari</strong>
          <span class="me-chat__meta-sep" aria-hidden="true">·</span>
          <span class="me-chat__online-pill">
            <span class="me-chat__dot" aria-hidden="true"></span>
            <span data-i18n="clone_online">Online</span>
          </span>
        </p>
      </header>

      <section class="me-chat__panel" aria-label="AI clone chat">
        <div id="me-chat-messages" class="me-chat__messages" aria-live="polite" data-i18n-aria-label="clone_messages_aria">
          <div id="me-chat-welcome" class="me-chat__welcome">
            <img class="me-chat__welcome-avatar" src="assets/img/icon.png" alt="" width="72" height="72" decoding="async">
            <h2 class="me-chat__welcome-title" data-i18n="clone_welcome_title">Hi, I'm Samandari.</h2>
            <p class="me-chat__welcome-text" data-i18n="clone_welcome_text">Ask me about my path, my projects, or just say hi. I'm up at any hour. The real Samandari needs sleep.</p>
          </div>
        </div>

        <div class="me-chat__dock">
          <div class="me-chat__suggestions" id="me-chat-suggestions">
            <button type="button" class="me-chat__chip" data-prompt-i18n="clone_prompt_path" data-prompt="Tell me about your background.">
              <i class="bi bi-signpost-2" aria-hidden="true"></i>
              <span data-i18n="clone_chip_path">Your path</span>
            </button>
            <button type="button" class="me-chat__chip" data-prompt-i18n="clone_prompt_projects" data-prompt="What projects are you working on?">
              <i class="bi bi-kanban" aria-hidden="true"></i>
              <span data-i18n="clone_chip_projects">Your projects</span>
            </button>
            <button type="button" class="me-chat__chip" data-prompt-i18n="clone_prompt_skills" data-prompt="What are your technical skills?">
              <i class="bi bi-cpu" aria-hidden="true"></i>
              <span data-i18n="clone_chip_skills">Your skills</span>
            </button>
            <button type="button" class="me-chat__chip" data-prompt-i18n="clone_prompt_contact" data-prompt="How can I contact you?">
              <i class="bi bi-envelope" aria-hidden="true"></i>
              <span data-i18n="clone_chip_contact">Contact you</span>
            </button>
          </div>

          <form id="me-chat-form" class="me-chat__composer">
            <label class="sr-only" for="me-chat-input" data-i18n="clone_input_label">Your message</label>
            <textarea id="me-chat-input" class="me-chat__input" rows="1" data-i18n-placeholder="clone_input_placeholder" placeholder="Ask me anything…" autocomplete="off" required></textarea>
            <div class="me-chat__toolbar">
              <span class="me-chat__persona">
                <img class="me-chat__persona-avatar" src="assets/img/icon.png" alt="" width="18" height="18" decoding="async">
                <span data-i18n="clone_composer_persona">Ask Samandari</span>
              </span>
              <button type="submit" id="me-chat-send" class="me-chat__send" data-i18n-aria-label="clone_send_aria" aria-label="Send message">
                <i class="bi bi-send-fill" aria-hidden="true"></i>
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
